# Runs the whole application: PostgreSQL + Spring Boot API + React frontend.
#   docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: immersia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immersia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the localhost URL in application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/immersia_db
      DB_PASSWORD: ${DB_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # The backend only allows CORS requests from http://localhost:5173
      - "5173:80"

volumes:
  db-data:
